<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>파티 찾기 - GP.Hub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="finder-page">
    <div class="finder">

        <!-- 왼쪽: 게임 목록. 누르면 그 게임의 파티만 보인다. -->
        <nav class="game-rail" aria-label="게임 선택">
            <a class="rail-item" th:href="@{/parties(keyword=${keyword}, open=${open ? 'true' : null}, sort=${sort})}"
               th:classappend="${gameId == null} ? 'active'"
               th:attr="aria-current=${gameId == null} ? 'page'">
                <span class="rail-thumb all" aria-hidden="true">전체</span>
                <span class="rail-name">전체 게임</span>
            </a>
            <a class="rail-item" th:each="g : ${games}"
               th:href="@{/parties(gameId=${g.id}, keyword=${keyword}, open=${open ? 'true' : null}, sort=${sort})}"
               th:classappend="${gameId != null and gameId == g.id} ? 'active'"
               th:attr="aria-current=${gameId != null and gameId == g.id} ? 'page'">
                <span class="rail-thumb" th:style="'--h:' + ${(g.id * 47) % 360}" aria-hidden="true">
                    <img th:if="${g.slug != null}" th:src="@{/images/games/{s}.jpg(s=${g.slug})}"
                         alt="" loading="lazy" decoding="async" onerror="this.remove()">
                </span>
                <span class="rail-name" th:text="${g.name}"></span>
            </a>
        </nav>

        <!-- 오른쪽: 검색과 파티 카드 -->
        <section class="finder-main">
            <div class="finder-head">
                <div>
                    <h2 th:text="${selectedGame != null} ? ${selectedGame.name} + ' 파티' : '파티 찾기'">파티 찾기</h2>
                    <p class="sub" th:text="${parties.totalElements} + '개의 파티'"></p>
                </div>
                <a class="btn small" th:href="@{/parties/new}" sec:authorize="isAuthenticated()">+ 파티 만들기</a>
            </div>

            <div class="notice ok" th:if="${message}" th:text="${message}"></div>
            <div class="notice fail" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/parties}" method="get" class="finder-search">
                <input type="hidden" name="gameId" th:if="${gameId != null}" th:value="${gameId}">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="파티 제목으로 검색" aria-label="파티 제목 검색">
                <button type="submit" class="btn small">검색</button>

                <!-- 보기 옵션: 바꾸면 바로 다시 불러온다 (첫 페이지부터) -->
                <div class="finder-options">
                    <label class="check-option">
                        <input type="checkbox" name="open" value="true" th:checked="${open}"
                               onchange="this.form.submit()">
                        <span>모집중만 보기</span>
                    </label>
                    <label class="sort-option">
                        <span class="sub">정렬</span>
                        <select name="sort" aria-label="정렬" onchange="this.form.submit()">
                            <option th:each="s : ${sortOptions}" th:value="${s.code}" th:text="${s.label}"
                                    th:selected="${s == currentSort}"></option>
                        </select>
                    </label>
                </div>
            </form>

            <ul class="party-grid" th:unless="${parties.empty}">
                <li th:each="p : ${parties.content}">
                    <a class="party-card" th:href="@{/parties/{id}(id=${p.id})}">
                        <span class="cover" th:style="'--h:' + ${(p.gameId * 47) % 360}">
                            <img th:if="${p.gameSlug != null}" th:src="@{/images/games/{s}.jpg(s=${p.gameSlug})}"
                                 alt="" loading="lazy" decoding="async" onerror="this.remove()">
                            <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(p.status.name())}"
                                  th:text="${p.status.label}"></span>
                        </span>
                        <span class="body">
                            <span class="game-name" th:text="${p.gameName}"></span>
                            <strong class="title" th:text="${p.title}"></strong>
                            <span class="host">
                                <span th:text="${p.hostNickname}"></span>
                                <span class="manner" th:if="${p.hostReviewCount > 0}"
                                      th:text="'매너 ' + ${p.hostMannerScore} + '점'"></span>
                                <span class="manner none" th:unless="${p.hostReviewCount > 0}">평가 없음</span>
                            </span>
                            <span class="people">
                                <span class="bar" aria-hidden="true">
                                    <span class="fill" th:style="'width:' + ${p.fillPercent} + '%'"></span>
                                </span>
                                <span class="count" th:text="${p.currentMembers} + ' / ' + ${p.maxMembers} + '명'"></span>
                            </span>
                            <span class="date" th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                        </span>
                    </a>
                </li>
            </ul>

            <div class="empty-state" th:if="${parties.empty}">
                <p th:if="${gameId != null or keyword != null or open}">조건에 맞는 파티가 없어요.</p>
                <p th:unless="${gameId != null or keyword != null or open}">아직 등록된 파티가 없어요.</p>
                <a class="btn small" th:href="@{/parties/new}" sec:authorize="isAuthenticated()">첫 파티 만들기</a>
                <a class="btn small ghost" th:href="@{/parties}" th:if="${gameId != null or keyword != null or open}">전체 파티 보기</a>
            </div>

            <div class="pagination" th:if="${parties.totalPages > 1}">
                <a th:each="i : ${#numbers.sequence(0, parties.totalPages - 1)}"
                   th:href="@{/parties(page=${i}, gameId=${gameId}, keyword=${keyword}, open=${open ? 'true' : null}, sort=${sort})}"
                   th:text="${i + 1}"
                   th:classappend="${i == parties.number} ? 'active'"></a>
            </div>
        </section>
    </div>
</main>
<script th:src="@{/js/finder-rail.js}" defer></script>
</body>
</html>
