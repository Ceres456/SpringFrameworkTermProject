<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 - GameParty</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <div class="card">
        <h2>회원가입</h2>
        <form th:action="@{/signup}" th:object="${signupForm}" method="post">
            <label for="username">아이디</label>
            <input type="text" id="username" th:field="*{username}">
            <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>

            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}">
            <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <label for="passwordConfirm">비밀번호 확인</label>
            <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}">
            <div class="error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></div>

            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" th:field="*{nickname}">
            <div class="error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></div>

            <label for="mainGame">주로 하는 게임 (선택)</label>
            <input type="text" id="mainGame" th:field="*{mainGame}">
            <div class="error" th:if="${#fields.hasErrors('mainGame')}" th:errors="*{mainGame}"></div>

            <button type="submit" class="btn">가입하기</button>
        </form>
    </div>
</main>
</body>
</html>
