<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>리뷰 관리 - GameParty</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="admin-page">
    <h2>관리자 페이지</h2>
    <nav th:replace="~{fragments/admin-nav :: nav('reviews')}"></nav>

    <div class="notice ok" th:if="${message}" th:text="${message}"></div>
    <div class="notice fail" th:if="${error}" th:text="${error}"></div>

    <p class="sub" th:text="'리뷰 ' + ${reviews.totalElements} + '개 (최신순)'"></p>

    <div class="table-wrap">
        <table class="admin-table">
            <thead>
            <tr><th>번호</th><th>파티</th><th>작성자</th><th>받은 사람</th><th>점수</th><th>한줄평</th><th>작성일</th><th>관리</th></tr>
            </thead>
            <tbody>
            <tr th:each="r : ${reviews.content}">
                <td th:text="${r.id}"></td>
                <td class="wrap"><a th:href="@{/parties/{id}(id=${r.party.id})}" th:text="${r.party.title}"></a></td>
                <td th:text="${r.reviewer.nickname}"></td>
                <td th:text="${r.target.nickname}"></td>
                <td><span class="stars" th:text="${'★'.repeat(r.rating)} + ' ' + ${r.rating}"></span></td>
                <td class="wrap" th:text="${r.comment != null} ? ${r.comment} : '-'"></td>
                <td th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <form th:action="@{/admin/reviews/{id}/delete(id=${r.id})}" method="post"
                          data-confirm="이 리뷰를 삭제할까요?&#10;받은 사람의 매너 점수가 다시 계산됩니다."
                          data-confirm-ok="삭제" data-confirm-tone="danger">
                        <input type="hidden" name="page" th:value="${reviews.number}">
                        <button type="submit" class="btn small danger">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="hint" th:if="${reviews.empty}">아직 남겨진 리뷰가 없어요.</p>

    <div class="pagination" th:if="${reviews.totalPages > 1}">
        <a th:each="i : ${#numbers.sequence(0, reviews.totalPages - 1)}"
           th:href="@{/admin/reviews(page=${i})}"
           th:text="${i + 1}" th:classappend="${i == reviews.number} ? 'active'"></a>
    </div>
</main>
</body>
</html>
