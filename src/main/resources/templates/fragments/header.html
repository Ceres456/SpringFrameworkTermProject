<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="nav" th:fragment="header">
    <a class="logo" th:href="@{/parties}">GP.Hub</a>
    <nav>
        <a th:href="@{/parties}">파티 찾기</a>
        <a class="nav-cta" th:href="@{/parties/new}" sec:authorize="isAuthenticated()">파티 만들기</a>
        <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">관리자</a>
        <span sec:authorize="isAuthenticated()">
            <a class="user" th:href="@{/mypage}"><span sec:authentication="name"></span>님 (마이페이지)<span class="notif-badge" th:if="${notificationCount != null and notificationCount > 0}"
                  th:text="${notificationCount}" th:title="'새 소식 ' + ${notificationCount} + '건'"></span></a>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit" class="link">로그아웃</button>
            </form>
        </span>
        <span sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}">로그인</a>
            <a class="nav-cta" th:href="@{/signup}">회원가입</a>
        </span>
        <!-- 다크 / 화이트 모드 전환 (js/theme.js) -->
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="화이트 모드로 전환" title="화이트 모드로 전환">
            <svg class="tt-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
            <svg class="tt-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 13.2A8.5 8.5 0 1 1 10.8 3a6.8 6.8 0 0 0 10.2 10.2z"/>
            </svg>
            <span class="tt-text">화이트 모드</span>
        </button>
    </nav>
    <!-- 모든 페이지 공용: data-confirm 이 붙은 폼에 사이트 디자인의 확인창을 띄운다 -->
    <script th:src="@{/js/confirm-modal.js}" defer></script>
</header>
</body>
</html>
