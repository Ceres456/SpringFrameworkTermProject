<body>

<nav class="admin-nav" th:fragment="nav(active)" aria-label="관리자 메뉴">
    <a th:href="@{/admin}" th:classappend="${active == 'dashboard'} ? 'on'">대시보드</a>
    <a th:href="@{/admin/members}" th:classappend="${active == 'members'} ? 'on'">회원 관리</a>
    <a th:href="@{/admin/parties}" th:classappend="${active == 'parties'} ? 'on'">파티 관리</a>
    <a th:href="@{/admin/reviews}" th:classappend="${active == 'reviews'} ? 'on'">리뷰 관리</a>
</nav>
</body>
</html>
