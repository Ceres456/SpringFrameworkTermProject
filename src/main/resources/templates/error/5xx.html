<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>서버에 문제가 생겼어요 - GP.Hub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<!-- 상태 코드를 알 수 없을 때(주소창에 /error 를 직접 입력한 경우 등)는 500 으로 보여 준다 -->
<main th:replace="~{fragments/error-page :: page(${status != null and status >= 500 and status < 600 ? status : 500}, '서버에 문제가 생겼어요', '잠시 뒤에 다시 시도해 주세요. 문제가 계속되면 관리자에게 알려 주세요.')}"></main>
<script th:src="@{/js/error-page.js}" defer></script>
</body>
</html>
