spring.application.name=GP.Hub

# --- 로컬 전용 DB 계정 파일 (Git 제외). 프로젝트 루트의 local-db.properties 가 있으면 읽는다. ---
spring.config.import=optional:file:./local-db.properties

# --- MySQL (DB 계정 정보는 local-db.properties 또는 환경변수 DB_USERNAME / DB_PASSWORD 로 지정) ---
spring.datasource.url=jdbc:mysql://localhost:3306/gameparty?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false
