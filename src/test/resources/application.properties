spring.application.name=GP.Hub-test

# 테스트 전용 설정: MySQL 대신 메모리 DB(H2, MySQL 호환 모드)를 쓴다.
# 이 파일이 src/main/resources/application.properties 를 가리므로 local-db.properties 도 읽지 않는다.
spring.datasource.url=jdbc:h2:mem:gameparty-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# 관리자 계정은 만들지 않는다 (테스트가 필요한 계정을 직접 만든다)
app.admin.password=
