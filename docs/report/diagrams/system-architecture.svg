<text x="945" y="101" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="start" >기술 스택</text>
<text x="945" y="134" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• Java 21 · Gradle</text>
<text x="945" y="155" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• Spring Boot 4.2</text>
<text x="945" y="176" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• Spring MVC + Thymeleaf</text>
<text x="945" y="197" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• Spring Data JPA (Hibernate)</text>
<text x="945" y="218" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• Spring Security (BCrypt · CSRF)</text>
<text x="945" y="239" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• MySQL 8</text>
<text x="945" y="260" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• Lombok</text>
<text x="945" y="281" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• 순수 CSS · 바닐라 JS (프레임워크 없음)</text>
<rect x="930" y="314" width="270" height="150" rx="10" fill="#f8fafc" stroke="#b45309" stroke-width="1.8"/>
<rect x="930" y="314" width="270" height="30" rx="10" fill="#b45309"/>
<rect x="930" y="332" width="270" height="12" fill="#b45309"/>
<text x="945" y="335" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="start" >서버 시작 시 실행</text>
<text x="945" y="368" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• GameDataInitializer : 게임 39종 등록</text>
<text x="945" y="389" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• AdminAccountInitializer : 관리자 계정</text>
<text x="945" y="410" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• DummyDataInitializer : 시연용 더미</text>
<text x="945" y="431" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >   (--app.seed-dummy=true 일 때만)</text>
<rect x="930" y="484" width="270" height="356" rx="10" fill="#f8fafc" stroke="#0d9488" stroke-width="1.8"/>
<rect x="930" y="484" width="270" height="30" rx="10" fill="#0d9488"/>
<rect x="930" y="502" width="270" height="12" fill="#0d9488"/>
<text x="945" y="505" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="start" >설계 포인트</text>
<text x="945" y="538" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• open-in-view=false → 화면에는 DTO만</text>
<text x="945" y="559" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• EntityGraph/fetch join 으로 N+1 방지</text>
<text x="945" y="580" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• 정원 동시 변경은 비관적 락으로 보호</text>
<text x="945" y="601" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• 승인 인원에 따라 모집중↔인원마감 전환</text>
<text x="945" y="622" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• 종료된 파티에서만 참가자끼리 1회 리뷰</text>
<text x="945" y="643" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• 리뷰·회원·파티 삭제 시 점수 재계산</text>
<text x="945" y="664" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• 공용 검증기로 수정 규칙 통일</text>
<text x="945" y="685" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• 규칙은 서버에서 검증</text>
<text x="945" y="706" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >• 관리자 비밀번호는 Git 제외 파일에 보관</text>
</svg>
