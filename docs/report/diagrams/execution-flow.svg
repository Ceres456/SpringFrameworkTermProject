<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1090" width="1120" height="1090" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<title>GameParty 실행 흐름도</title>
<rect width="1120" height="1090" fill="#ffffff"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
</defs>
<text x="40" y="34" font-size="22" font-weight="bold" fill="#1f2430" text-anchor="start" >GameParty 실행 흐름도</text>
<rect x="20" y="56" width="360" height="1010" fill="#eff6ff" stroke="#cbd5e1"/>
<rect x="20" y="56" width="360" height="40" fill="#2563eb"/>
<text x="200" y="82" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" >회원 · 참가자</text>
<rect x="380" y="56" width="360" height="1010" fill="#f5f3ff" stroke="#cbd5e1"/>
<rect x="380" y="56" width="360" height="40" fill="#7c3aed"/>
<text x="560" y="82" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" >방장</text>
<rect x="740" y="56" width="360" height="1010" fill="#f0fdfa" stroke="#cbd5e1"/>
<rect x="740" y="56" width="360" height="40" fill="#0d9488"/>
<text x="920" y="82" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" >시스템 · 관리자</text>
<rect x="60" y="120" width="280" height="82" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<circle cx="84" cy="146" r="14" fill="#2563eb"/>
<text x="84" y="151" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" >1</text>
<text x="108" y="151" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start" >회원가입</text>
<text x="74" y="176" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >/signup · 아이디 · 비밀번호 · 닉네임</text>
<text x="74" y="194" font-size="11.5" font-weight="normal" fill="#667085" text-anchor="start" >주 게임 선택(드래그/검색) · BCrypt 저장</text>
<rect x="60" y="225" width="280" height="82" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<circle cx="84" cy="251" r="14" fill="#2563eb"/>
<text x="84" y="256" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" >2</text>
<text x="108" y="256" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start" >로그인</text>
<text x="74" y="281" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >/login · Spring Security 세션</text>
<text x="74" y="299" font-size="11.5" font-weight="normal" fill="#667085" text-anchor="start" >관리자는 ADMIN 권한으로 로그인</text>
<rect x="420" y="330" width="280" height="82" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="444" cy="356" r="14" fill="#7c3aed"/>
<text x="444" y="361" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" >3</text>
<text x="468" y="361" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start" >파티 만들기</text>
<text x="434" y="386" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >/parties/new · 게임 · 제목 · 인원</text>
<text x="434" y="404" font-size="11.5" font-weight="normal" fill="#667085" text-anchor="start" >방장은 '참가 중'으로 자동 등록</text>
<rect x="60" y="435" width="280" height="82" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<circle cx="84" cy="461" r="14" fill="#2563eb"/>
<text x="84" y="466" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" >4</text>
<text x="108" y="466" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start" >파티 찾기</text>
<text x="74" y="491" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >/parties · 게임별 필터 · 제목 검색</text>
<text x="74" y="509" font-size="11.5" font-weight="normal" fill="#667085" text-anchor="start" >12개씩 페이지 · 상세에서 다른 파티도 탐색</text>
<rect x="60" y="540" width="280" height="82" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<circle cx="84" cy="566" r="14" fill="#2563eb"/>
<text x="84" y="571" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" >5</text>
<text x="108" y="571" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start" >참가 신청</text>
<text x="74" y="596" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >모집중 파티에만 · 상태 '승인 대기'</text>
<text x="74" y="614" font-size="11.5" font-weight="normal" fill="#667085" text-anchor="start" >중복 신청 · 내 파티 신청 불가</text>
<rect x="420" y="645" width="280" height="82" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="444" cy="671" r="14" fill="#7c3aed"/>
<text x="444" y="676" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" >6</text>
<text x="468" y="676" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start" >신청 승인 / 거절</text>
<text x="434" y="701" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >정원이 차면 자동 '인원마감'</text>
<text x="434" y="719" font-size="11.5" font-weight="normal" fill="#667085" text-anchor="start" >정원 동시 변경은 비관적 락으로 보호</text>
<rect x="420" y="750" width="280" height="82" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="444" cy="776" r="14" fill="#7c3aed"/>
<text x="444" y="781" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" >7</text>
<text x="468" y="781" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start" >파티 종료</text>
<text x="434" y="806" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >수정 · 삭제 · 신청 처리 잠금</text>
<text x="434" y="824" font-size="11.5" font-weight="normal" fill="#667085" text-anchor="start" >참가자끼리 리뷰 작성 가능해짐</text>
<rect x="60" y="855" width="280" height="82" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<circle cx="84" cy="881" r="14" fill="#2563eb"/>
<text x="84" y="886" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" >8</text>
<text x="108" y="886" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start" >매너 리뷰 작성</text>
<text x="74" y="911" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >별점 1~5 + 한줄평 · 본인 제외</text>
<text x="74" y="929" font-size="11.5" font-weight="normal" fill="#667085" text-anchor="start" >같은 파티 · 같은 사람에게 1회</text>
<rect x="780" y="960" width="280" height="82" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<circle cx="804" cy="986" r="14" fill="#0d9488"/>
<text x="804" y="991" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" >9</text>
<text x="828" y="991" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start" >매너 점수 갱신</text>
<text x="794" y="1016" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >받은 리뷰 평균(소수 1자리)</text>
<text x="794" y="1034" font-size="11.5" font-weight="normal" fill="#667085" text-anchor="start" >목록 · 상세 · 마이페이지에 표시</text>
<rect x="780" y="225" width="280" height="82" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<rect x="790" y="237" width="34" height="20" rx="5" fill="#0d9488"/>
<text x="807" y="252" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" >관리</text>
<text x="834" y="256" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start" >관리자 로그인</text>
<text x="794" y="281" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >/admin · ADMIN 권한만 접근</text>
<text x="794" y="299" font-size="11.5" font-weight="normal" fill="#667085" text-anchor="start" >일반 회원은 403 으로 차단</text>
<rect x="780" y="330" width="280" height="82" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<rect x="790" y="342" width="34" height="20" rx="5" fill="#0d9488"/>
<text x="807" y="357" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" >관리</text>
<text x="834" y="361" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start" >관리자 페이지</text>
<text x="794" y="386" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >대시보드 통계 · 회원/파티/리뷰 관리</text>
<text x="794" y="404" font-size="11.5" font-weight="normal" fill="#667085" text-anchor="start" >회원 정보 조회·수정 · 권한 부여</text>
<rect x="780" y="435" width="280" height="82" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<rect x="790" y="447" width="34" height="20" rx="5" fill="#0d9488"/>
<text x="807" y="462" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" >관리</text>
<text x="834" y="466" font-size="16" font-weight="bold" fill="#1f2430" text-anchor="start" >삭제 · 강제 종료</text>
<text x="794" y="491" font-size="12" font-weight="normal" fill="#1f2430" text-anchor="start" >회원 · 파티 · 리뷰 삭제, 파티 강제 종료</text>
<text x="794" y="509" font-size="11.5" font-weight="normal" fill="#667085" text-anchor="start" >딸린 참가 내역과 리뷰까지 함께 정리</text>
